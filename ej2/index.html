<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 2 - Formulario con Bootstrap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-5">
 <a href="../index.html" class="btn btn-link mb-2">← Menú</a>
 <div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-7">
   <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-4">Registro de estudiante</h1>
    <form class="row g-3 needs-validation" novalidate>
     <div class="col-12 col-md-6"><label for="nombres" class="form-label">Nombres</label>
      <input type="text" class="form-control" id="nombres" required><div class="invalid-feedback">Ingrese sus nombres.</div></div>
     <div class="col-12 col-md-6"><label for="apellidos" class="form-label">Apellidos</label>
      <input type="text" class="form-control" id="apellidos" required><div class="invalid-feedback">Ingrese sus apellidos.</div></div>
     <div class="col-12"><label for="correo" class="form-label">Correo</label>
      <input type="email" class="form-control" id="correo" required><div class="invalid-feedback">Ingrese un correo válido.</div></div>
     <div class="col-12 col-md-6"><label for="carrera" class="form-label">Carrera</label>
      <select class="form-select" id="carrera" required><option value="">Seleccione...</option><option>Ingeniería de Sistemas</option><option>Ingeniería de Software</option><option>Ciencias de la Computación</option></select>
      <div class="invalid-feedback">Seleccione una carrera.</div></div>
     <div class="col-12 col-md-6"><label for="ciclo" class="form-label">Ciclo</label>
      <input type="number" class="form-control" id="ciclo" min="1" max="10" required><div class="invalid-feedback">Ingrese un ciclo entre 1 y 10.</div></div>
     <div class="col-12"><div class="form-check">
      <input class="form-check-input" type="checkbox" id="acepto" required>
      <label class="form-check-label" for="acepto">Acepto los términos</label>
      <div class="invalid-feedback">Debe aceptar los términos.</div></div></div>
     <div class="col-12 d-grid d-md-flex justify-content-md-end"><button class="btn btn-primary" type="submit">Registrar</button></div>
    </form>
   </div></div>
  </div>
 </div>
</main>
<script>
document.querySelectorAll('.needs-validation').forEach(form => {
  form.addEventListener('submit', event => {
    if (!form.checkValidity()) { event.preventDefault(); event.stopPropagation(); }
    form.classList.add('was-validated');
  });
});
</script>
</body>
</html>
