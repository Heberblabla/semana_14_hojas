<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesto 2 - Tienda en línea</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>.prod-img{height:140px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:#f1f3f5}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container d-flex justify-content-between">
 <span class="navbar-brand">🛍️ MiTienda</span>
 <a href="../index.html" class="btn btn-sm btn-outline-light">← Menú</a></div></nav>
<main class="container my-4">
 <div class="row g-4">
  <!-- Filtro: arriba en móvil, lateral desde lg -->
  <aside class="col-12 col-lg-3">
   <div class="card shadow-sm"><div class="card-body">
    <h2 class="h5">Filtros</h2>
    <label class="form-label mt-2" for="fCat">Categoría</label>
    <select id="fCat" class="form-select"><option value="">Todas</option><option>Tecnología</option><option>Hogar</option><option>Deporte</option></select>
    <label class="form-label mt-3" for="fPrecio">Precio máximo: S/ <span id="pv">500</span></label>
    <input type="range" class="form-range" id="fPrecio" min="20" max="500" step="10" value="500">
    <button id="limpiar" class="btn btn-outline-secondary btn-sm w-100 mt-2">Limpiar</button>
   </div></div>
  </aside>
  <section class="col-12 col-lg-9">
   <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 m-0">Catálogo</h1><span class="badge text-bg-primary" id="cant"></span></div>
   <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3" id="grid"></div>
  </section>
 </div>
</main>
<div class="modal fade" id="detalle" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
 <div class="modal-header"><h2 class="modal-title h5" id="mTitulo"></h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
 <div class="modal-body text-center"><div class="display-1" id="mIcono"></div><p class="mt-3" id="mDesc"></p><p class="fs-4 fw-bold text-success" id="mPrecio"></p><span class="badge text-bg-secondary" id="mCat"></span></div>
 <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button class="btn btn-primary">Agregar al carrito</button></div>
</div></div></div>
<script>
const productos=[
 {n:"Audífonos",p:120,c:"Tecnología",i:"🎧",d:"Audífonos inalámbricos con cancelación de ruido."},
 {n:"Teclado",p:90,c:"Tecnología",i:"⌨️",d:"Teclado mecánico retroiluminado."},
 {n:"Lámpara",p:45,c:"Hogar",i:"💡",d:"Lámpara LED de escritorio regulable."},
 {n:"Cafetera",p:210,c:"Hogar",i:"☕",d:"Cafetera automática de 12 tazas."},
 {n:"Balón",p:60,c:"Deporte",i:"⚽",d:"Balón de fútbol N.° 5."},
 {n:"Bicicleta",p:480,c:"Deporte",i:"🚲",d:"Bicicleta de montaña aro 26."},
 {n:"Mouse",p:35,c:"Tecnología",i:"🖱️",d:"Mouse ergonómico inalámbrico."},
 {n:"Silla",p:300,c:"Hogar",i:"🪑",d:"Silla de oficina con soporte lumbar."},
 {n:"Zapatillas",p:180,c:"Deporte",i:"👟",d:"Zapatillas ligeras para correr."}];
const grid=document.getElementById('grid'),fCat=document.getElementById('fCat'),fP=document.getElementById('fPrecio');
const modal=new bootstrap.Modal(document.getElementById('detalle'));
function pintar(){
 document.getElementById('pv').textContent=fP.value;
 const l=productos.filter(x=>(!fCat.value||x.c===fCat.value)&&x.p<=+fP.value);
 document.getElementById('cant').textContent=l.length+' productos';
 grid.innerHTML=l.map(x=>'<div class="col"><div class="card h-100 shadow-sm"><div class="prod-img">'+x.i+'</div><div class="card-body d-flex flex-column"><h3 class="h6 card-title">'+x.n+'</h3><p class="fw-bold mb-3">S/ '+x.p+'</p><div class="d-flex gap-2 mt-auto"><button class="btn btn-outline-primary btn-sm flex-fill" data-n="'+x.n+'">Ver detalle</button><button class="btn btn-primary btn-sm flex-fill">Comprar</button></div></div></div></div>').join('')||'<p class="text-muted">Sin resultados.</p>';
}
grid.addEventListener('click',e=>{const n=e.target.dataset.n;if(!n)return;const x=productos.find(p=>p.n===n);
 mTitulo.textContent=x.n;mIcono.textContent=x.i;mDesc.textContent=x.d;mPrecio.textContent='S/ '+x.p;mCat.textContent=x.c;modal.show();});
fCat.onchange=fP.oninput=pintar;
document.getElementById('limpiar').onclick=()=>{fCat.value='';fP.value=500;pintar();};
pintar();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
