<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesto 4 - Formulario de contacto</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-5"><a href="../index.html" class="btn btn-link mb-2">← Menú</a>
<div class="row justify-content-center"><div class="col-12 col-md-10 col-lg-6">
 <div id="ok" class="alert alert-success alert-dismissible fade show d-none" role="alert">
  ✅ ¡Mensaje enviado correctamente! Te responderemos pronto.
  <button type="button" class="btn-close" aria-label="Cerrar" onclick="this.parentElement.classList.add('d-none')"></button></div>
 <div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h3 mb-4">Contáctanos</h1>
  <form id="f" class="row g-3 needs-validation" novalidate>
   <div class="col-12 col-md-6"><label class="form-label" for="nom">Nombre</label><input class="form-control" id="nom" required minlength="3"><div class="invalid-feedback">Ingrese su nombre (mín. 3 letras).</div></div>
   <div class="col-12 col-md-6"><label class="form-label" for="mail">Correo</label><input type="email" class="form-control" id="mail" required><div class="invalid-feedback">Ingrese un correo válido.</div></div>
   <div class="col-12"><label class="form-label" for="asu">Asunto</label>
    <select class="form-select" id="asu" required><option value="">Seleccione...</option><option>Consulta</option><option>Soporte</option><option>Sugerencia</option><option>Otro</option></select>
    <div class="invalid-feedback">Seleccione un asunto.</div></div>
   <div class="col-12"><label class="form-label" for="msg">Mensaje</label><textarea class="form-control" id="msg" rows="4" required minlength="10"></textarea><div class="invalid-feedback">Escriba un mensaje (mín. 10 caracteres).</div></div>
   <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="acepto" required><label class="form-check-label" for="acepto">Acepto el tratamiento de mis datos</label><div class="invalid-feedback">Debe aceptar para continuar.</div></div></div>
   <div class="col-12 d-grid d-md-flex justify-content-md-end"><button class="btn btn-primary" type="submit">Enviar</button></div>
  </form>
 </div></div>
</div></div></main>
<script>
const f=document.getElementById('f'),ok=document.getElementById('ok');
f.addEventListener('submit',e=>{
  e.preventDefault();
  if(!f.checkValidity()){e.stopPropagation();ok.classList.add('d-none');}
  else{ok.classList.remove('d-none');f.reset();f.classList.remove('was-validated');window.scrollTo({top:0,behavior:'smooth'});return;}
  f.classList.add('was-validated');
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
